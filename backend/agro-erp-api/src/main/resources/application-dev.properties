spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/agro_db}
spring.datasource.username=${DB_USERNAME:agro_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-production-32chars}
app.security.jwt.issuer=${JWT_ISSUER:agro-erp-api}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

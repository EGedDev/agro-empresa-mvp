spring.datasource.url=jdbc:h2:mem:agro_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false

app.security.jwt.secret=test-secret-for-jwt-validation-change-not-used-in-production
app.security.jwt.issuer=agro-erp-api-test
app.security.jwt.expiration-minutes=60
app.security.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

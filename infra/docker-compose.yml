services:
  postgres:
    image: postgres:16-alpine
    container_name: agro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agro_db
      POSTGRES_USER: agro_user
      POSTGRES_PASSWORD: agro_password_dev
    ports:
      - "5433:5432"
    volumes:
      - agro_postgres_data:/var/lib/postgresql/data

volumes:
  agro_postgres_data: